<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Google Sheets CRUD</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-body-tertiary">
    <div class="container py-4" style="max-width: 1080px">
      <!-- 說明 -->
      <div
        class="alert alert-primary d-flex flex-wrap gap-2 justify-content-between align-items-center"
        role="alert"
      >
        <div>
          <h3>Google Sheets CRUD 範例</h3>
          <ul>
            <li>將試算表做為簡易的資料庫，透過此頁前端做資料操作，使用 <code>Apps Script Web</code> 做為 API 後端。</li>
            <li>由於是測試用途，已排程每隔 5 分鐘將會自動還原試算表。</li>
          </ul>
        </div>
        <a
          class="btn btn-sm btn-primary"
          target="_blank"
          rel="noopener"
          id="openSheets"
          >開啟試算表</a
        >
      </div>

      <div class="row g-4">
        <!-- 資料列表 -->
        <div class="col-12">
          <div class="card shadow-sm border-0">
            <div
              class="card-header bg-white d-flex flex-wrap gap-2 justify-content-between align-items-center py-3"
            >
              <h5 class="mb-0">員工資料列表</h5>
              <div class="d-flex align-items-center gap-2">
                <span id="listMsg" class="small text-muted"></span>
                <button
                  class="btn btn-sm btn-outline-primary"
                  onclick="refreshList()"
                >
                  重新整理
                </button>
              </div>
            </div>
            <div class="card-body">
              <div class="table-responsive">
                <table
                  class="table table-striped table-hover align-middle mb-0"
                >
                  <thead class="table-dark">
                    <tr>
                      <th>員工編號</th>
                      <th>姓名</th>
                      <th>年資</th>
                      <th>獎金</th>
                      <th>Email</th>
                    </tr>
                  </thead>
                  <tbody id="tbody">
                    <tr>
                      <td colspan="5" class="text-center text-muted py-4">
                        載入中…
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>

        <!-- 試算表即時預覽（iframe 觀察即時變化） -->
        <div class="col-12">
          <div class="card shadow-sm border-0">
            <div
              class="card-header bg-white d-flex flex-wrap gap-2 justify-content-between align-items-center py-3"
            >
              <h5 class="mb-0">試算表即時預覽</h5>
              <button
                class="btn btn-sm btn-outline-secondary"
                onclick="loadGoogleSheets()"
              >
                重新載入
              </button>
            </div>
            <div class="card-body">
              <iframe
                id="google_sheets"
                src=""
                class="w-100 border rounded"
                height="300"
                loading="lazy"
              >
              </iframe>
            </div>
          </div>
        </div>
      </div>

      <!-- CRUD 表單 -->
      <div class="row g-4 mt-0">
        <!-- 查詢 -->
        <div class="col-12 col-lg-6">
          <div class="card shadow-sm border-0 h-100">
            <div class="card-header bg-white py-3">
              <h5 class="mb-0">查詢資料</h5>
            </div>
            <div class="card-body">
              <div class="mb-3">
                <label for="uid" class="form-label">員工編號</label>
                <input
                  type="text"
                  class="form-control"
                  id="uid"
                  placeholder="例：a01"
                />
              </div>
              <button id="btn01" class="btn btn-primary" onclick="selectUid()">
                查詢
              </button>
              <p id="msg01" class="small mb-0 mt-3"></p>
            </div>
          </div>
        </div>

        <!-- 新增 -->
        <div class="col-12 col-lg-6">
          <div class="card shadow-sm border-0 h-100">
            <div class="card-header bg-white py-3">
              <h5 class="mb-0">新增資料</h5>
            </div>
            <div class="card-body">
              <div class="row g-3">
                <div class="col-12 col-sm-6">
                  <label for="new_uid" class="form-label">編號</label>
                  <input
                    type="text"
                    class="form-control"
                    id="new_uid"
                    placeholder="例：a11"
                  />
                </div>
                <div class="col-12 col-sm-6">
                  <label for="new_name" class="form-label">名稱</label>
                  <input
                    type="text"
                    class="form-control"
                    id="new_name"
                    placeholder="例：體育老師"
                  />
                </div>
              </div>
              <button
                id="btn02"
                class="btn btn-success mt-3"
                onclick="insertUid()"
              >
                加入
              </button>
              <p id="msg02" class="small mb-0 mt-3"></p>
            </div>
          </div>
        </div>

        <!-- 修改 -->
        <div class="col-12 col-lg-6">
          <div class="card shadow-sm border-0 h-100">
            <div class="card-header bg-white py-3">
              <h5 class="mb-0">修改資料（發獎金）</h5>
            </div>
            <div class="card-body">
              <div class="row g-3">
                <div class="col-12 col-sm-6">
                  <label for="update_uid" class="form-label">員工編號</label>
                  <input
                    type="text"
                    class="form-control"
                    id="update_uid"
                    placeholder="例：a01"
                  />
                </div>
                <div class="col-12 col-sm-6">
                  <label for="money" class="form-label">獎金</label>
                  <input
                    type="text"
                    inputmode="numeric"
                    class="form-control"
                    id="money"
                    placeholder="例：10000"
                  />
                </div>
              </div>
              <button
                id="btn03"
                class="btn btn-warning mt-3"
                onclick="updateUid()"
              >
                發大財
              </button>
              <p id="msg03" class="small mb-0 mt-3"></p>
            </div>
          </div>
        </div>

        <!-- 刪除 -->
        <div class="col-12 col-lg-6">
          <div class="card shadow-sm border-0 h-100">
            <div class="card-header bg-white py-3">
              <h5 class="mb-0">刪除資料</h5>
            </div>
            <div class="card-body">
              <div class="mb-3">
                <label for="del_uid" class="form-label">員工編號</label>
                <input
                  type="text"
                  class="form-control"
                  id="del_uid"
                  placeholder="例：a01"
                />
              </div>
              <button id="btn04" class="btn btn-danger" onclick="deleteUid()">
                開除
              </button>
              <p id="msg04" class="small mb-0 mt-3"></p>
            </div>
          </div>
        </div>
      </div>

      <footer class="text-center text-muted small py-4">
        <hr>
        <a href="https://github.com/ss-vip/google-sheets-demo" target="_blank">Github</a>
      </footer>
    </div>

    <!-- loading mask -->
    <div
      id="loadingOverlay"
      class="position-fixed top-0 start-0 w-100 h-100 d-none"
      style="background: rgba(0, 0, 0, 0.35); z-index: 2000; cursor: progress"
      aria-live="polite"
      aria-busy="true"
    >
      <div
        class="d-flex flex-column justify-content-center align-items-center h-100"
      >
        <div
          class="spinner-border text-primary"
          style="width: 3rem; height: 3rem"
          role="status"
        >
          <span class="visually-hidden">Loading…</span>
        </div>
        <div
          class="mt-3 fw-semibold text-white bg-dark bg-opacity-75 px-3 py-1 rounded-pill"
        >
          Loading ...
        </div>
      </div>
    </div>

    <!-- toast-->
    <div
      class="toast-container position-fixed top-0 end-0 p-3"
      style="z-index: 2100"
    >
      <div
        id="appToast"
        class="toast align-items-center text-white border-0"
        role="alert"
        aria-live="assertive"
        aria-atomic="true"
      >
        <div class="d-flex">
          <div class="toast-body" id="appToastBody"></div>
          <button
            type="button"
            class="btn-close btn-close-white me-2 m-auto"
            data-bs-dismiss="toast"
            aria-label="關閉"
          ></button>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      // 試算表網址 ID 填入
      const SHEETS_ID = "1R8yd6608Mux8tYlX2tNqNmOiKtrsxJDKJaxlHWRYBHU";

      // 請先部署 api.gs，取得部屬後的 /exec 網址填入
      const API_URL = "https://script.google.com/macros/s/AKfycbzqI809tL5VSIjbSaxLKoeSDwN82nX8_9LagIwWBH-JH5Q1rtkvIlpFFaoGzxTeVQHi/exec";

      const sheetsUrl = 'https://docs.google.com/spreadsheets/d/' + SHEETS_ID + '/edit#gid=0';
      const sheetsUrlHtml = 'https://docs.google.com/spreadsheets/d/' + SHEETS_ID + '/gviz/tq?tqx=out:html&tq&gid=0';
      const openSheetsBtn = document.getElementById('openSheets');
      openSheetsBtn.addEventListener('click', () => {
        window.open(sheetsUrl, '_blank');
      });

      window.addEventListener('DOMContentLoaded', () => {
        const iframe = document.getElementById('google_sheets');
        iframe.src = sheetsUrlHtml;
      });

      // loading mask
      let loadingCount = 0;
      function showLoading() {
        loadingCount++;
        document.getElementById("loadingOverlay").classList.remove("d-none");
      }
      function hideLoading() {
        loadingCount = Math.max(0, loadingCount - 1);
        if (loadingCount === 0) {
          document.getElementById("loadingOverlay").classList.add("d-none");
        }
      }

      // GET：讀取類（list / select）
      async function apiGet(params) {
        showLoading();
        try {
          const url = API_URL + "?" + new URLSearchParams(params).toString();
          const res = await fetch(url, { redirect: "follow" });
          if (!res.status) throw new Error("HTTP " + res.status);
          return res.json();
        } finally {
          hideLoading(); // close loading mask
        }
      }

      // POST：寫入類（insert / update / delete）
      async function apiPost(payload) {
        showLoading();
        try {
          const res = await fetch(API_URL, {
            method: "POST",
            redirect: "follow",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(payload),
          });
          if (!res.status) throw new Error("HTTP " + res.status);
          return res.json();
        } finally {
          hideLoading();
        }
      }

      // show message
      function setMsg(id, text, isError = false) {
        const el = document.getElementById(id);
        el.textContent = text;
        el.style.color = isError ? "crimson" : "";
      }

      function setBtnLoading(id, loading) {
        const btn = document.getElementById(id);
        btn.disabled = loading;
        btn.setAttribute("aria-busy", loading);
      }

      // toast
      function showToast(message, status) {
        const el = document.getElementById("appToast");
        el.classList.remove("bg-success", "bg-danger");
        el.classList.add(status ? "bg-success" : "bg-danger");
        document.getElementById("appToastBody").textContent = message;
        bootstrap.Toast.getOrCreateInstance(el, { delay: 3500 }).show();
      }

      function renderTable(rows) {
        const tbody = document.getElementById("tbody");
        if (!rows.length) {
          tbody.innerHTML = '<tr><td colspan="5">目前沒有資料</td></tr>';
          return;
        }
        tbody.innerHTML = "";
        for (const r of rows) {
          const tr = document.createElement("tr");
          const cells = [r.uid, r.name, r.seniority, r.money, r.email];
          for (const c of cells) {
            const td = document.createElement("td");
            td.textContent = c;
            tr.appendChild(td);
          }
          tbody.appendChild(tr);
        }
      }

      async function refreshList() {
        try {
          const out = await apiGet({ action: "list" });
          if (!out.status) throw new Error(out.error);
          renderTable(out.data);
          setMsg("listMsg", "更新時間：" + new Date().toLocaleTimeString("zh-TW"));
        } catch (err) {
          setMsg("listMsg", "載入失敗：" + err.message, true);
        }
      }

      // CRUD
      async function selectUid() {
        setBtnLoading("btn01", true);
        setMsg("msg01", "");
        try {
          const uid = document.getElementById("uid").value.trim();
          const out = await apiGet({ action: "select", uid: uid });
          const text = out.status
            ? `員工：${out.data.uid} 是【${out.data.name}】，已有【${out.data.seniority}】年資歷，獎金 ${out.data.money}。`
            : out.error;
          setMsg("msg01", text, !out.status);
          showToast(text, out.status);
        } catch (err) {
          setMsg("msg01", "發生錯誤：" + err.message, true);
          showToast("發生錯誤：" + err.message, false);
        } finally {
          setBtnLoading("btn01", false);
        }
      }

      async function insertUid() {
        setBtnLoading("btn02", true);
        setMsg("msg02", "");
        try {
          const uid = document.getElementById("new_uid").value.trim();
          const name = document.getElementById("new_name").value.trim();
          const out = await apiPost({ action: "insert", uid: uid, name: name });
          setMsg("msg02", out.status ? out.message : out.error, !out.status);
          showToast(out.status ? out.message : out.error, out.status);
          if (out.status) {
            refreshList();
            loadGoogleSheets();
          }
        } catch (err) {
          setMsg("msg02", "發生錯誤：" + err.message, true);
          showToast("發生錯誤：" + err.message, false);
        } finally {
          setBtnLoading("btn02", false);
        }
      }

      async function updateUid() {
        setBtnLoading("btn03", true);
        setMsg("msg03", "");
        try {
          const uid = document.getElementById("update_uid").value.trim();
          const money = document.getElementById("money").value.trim();
          const out = await apiPost({ action: "update", uid: uid, money: money });
          setMsg("msg03", out.status ? out.message : out.error, !out.status);
          showToast(out.status ? out.message : out.error, out.status);
          if (out.status) {
            refreshList();
            loadGoogleSheets();
          }
        } catch (err) {
          setMsg("msg03", "發生錯誤：" + err.message, true);
          showToast("發生錯誤：" + err.message, false);
        } finally {
          setBtnLoading("btn03", false);
        }
      }

      async function deleteUid() {
        setBtnLoading("btn04", true);
        setMsg("msg04", "");
        try {
          const uid = document.getElementById("del_uid").value.trim();
          if (!uid) {
            setMsg("msg04", "請輸入員工編號。", true);
            return;
          }
          if (!confirm("確定要開除編號 " + uid + " 的員工嗎？")) {
            setBtnLoading("btn04", false);
            return;
          }
          const out = await apiPost({ action: "delete", uid: uid });
          setMsg("msg04", out.status ? out.message : out.error, !out.status);
          showToast(out.status ? out.message : out.error, out.status);
          if (out.status) {
            refreshList();
            loadGoogleSheets();
          }
        } catch (err) {
          setMsg("msg04", "發生錯誤：" + err.message, true);
          showToast("發生錯誤：" + err.message, false);
        } finally {
          setBtnLoading("btn04", false);
        }
      }

      // iframe
      function loadGoogleSheets() {
        const f = document.getElementById("google_sheets");
        f.src = f.src;
      }
      refreshList();
    </script>
  </body>
</html>
